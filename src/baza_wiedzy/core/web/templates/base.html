<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css').path }}">
  <script src="{{ url_for('static', path='vendor/htmx-2.0.11.min.js').path }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home').path }}">{{ app_name }}</a>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    {{ _("Version %(version)s", version=app_version) }}
  </footer>
</body>
</html>
