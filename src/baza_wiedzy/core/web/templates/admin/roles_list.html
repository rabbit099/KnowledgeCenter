{% extends "admin/base.html" %}
{% from "admin/_macros.html" import done_box %}
{% block admin %}
<h1>{{ _("Roles") }}</h1>
{{ done_box(done) }}
<p><a class="button" href="/admin/roles/new">{{ _("New role") }}</a></p>
<form method="get" action="/admin/roles" class="filters" hx-get="/admin/roles" hx-target="#roles-table" hx-push-url="true" hx-trigger="input changed delay:300ms from:input[name=q], submit">
  <label>{{ _("Search") }} <input type="search" name="q" value="{{ filters.q }}" maxlength="100"></label>
  <button type="submit">{{ _("Filter") }}</button>
</form>
<div id="roles-table">{% include "admin/_roles_table.html" %}</div>
{% endblock %}
