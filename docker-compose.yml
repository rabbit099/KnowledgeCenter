# Production stack. Configuration comes from .env (see .env.example and
# docs/en/deployment-operations.md). Only the proxy publishes ports.
# Images: <IMAGE_PREFIX>-{app,worker,db,proxy}:<APP_VERSION> from GHCR (ADR-017), plus
# redis (and clamav with the antivirus profile) pinned by digest.
name: baza-wiedzy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Baza Wiedzy}
  APP_VERSION: ${APP_VERSION:?set APP_VERSION in .env}
  ENABLED_MODULES: ${ENABLED_MODULES:-documents,ingestion,search}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-baza_wiedzy}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${APP_DB_NAME:-baza_wiedzy}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  DATA_DIR: /data

services:
  proxy:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-proxy:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-110}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./secrets/tls:/certs:ro
    depends_on:
      - app
    logging: *logging

  app:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-app:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    environment: *app-env
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
    logging: *logging

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-worker:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    # One database connection per worker process (ADR-016); one thread per process.
    command: ["dramatiq", "baza_wiedzy.worker", "--processes", "${WORKER_PROCESSES:-2}", "--threads", "1"]
    environment:
      <<: *app-env
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    stop_grace_period: 60s
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    logging: *logging

  db:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-db:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Each connection loads the Polish dictionary (~27-30 MB). Size DB_MEMORY_LIMIT as
    # shared_buffers + max_connections x 35 MB + headroom (docs: deployment-operations.md).
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-baza_wiedzy}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME:-baza_wiedzy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${APP_DB_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-2g}
    logging: *logging

  redis:
    # Tag for readability, digest for integrity (offline bundle lists the same reference).
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The password comes from the environment, so it never appears in `docker inspect` args.
    command: ["sh", "-c", "exec redis-server --appendonly yes --save '' --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
    logging: *logging

  clamav:
    image: clamav/clamav:1.5.3@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
    profiles: ["antivirus"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - clamav-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: ${CLAMAV_MEMORY_LIMIT:-3g}
    logging: *logging

volumes:
  pgdata:
  redis-data:
  storage:
  caddy-data:
  caddy-config:
  clamav-db:
