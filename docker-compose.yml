# Production stack. Configuration comes from .env (see .env.example and
# docs/en/deployment-operations.md). Only the proxy publishes ports.
name: baza-wiedzy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Baza Wiedzy}
  APP_VERSION: ${APP_VERSION:?set APP_VERSION in .env}
  ENABLED_MODULES: ${ENABLED_MODULES:-documents,ingestion,search}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-baza_wiedzy}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${APP_DB_NAME:-baza_wiedzy}
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data

services:
  proxy:
    build: docker/caddy
    image: baza-wiedzy-proxy:local
    restart: unless-stopped
    <<: *hardening
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-110}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./secrets/tls:/certs:ro
    depends_on:
      - app
    logging: *logging

  app:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-app:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    environment: *app-env
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
    logging: *logging

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-worker:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    environment: *app-env
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    logging: *logging

  db:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-db:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Each connection loads the Polish dictionary (~27-30 MB). Size DB_MEMORY_LIMIT as
    # shared_buffers + max_connections x 35 MB + headroom (docs: deployment-operations.md).
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-baza_wiedzy}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME:-baza_wiedzy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${APP_DB_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-2g}
    logging: *logging

  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
    logging: *logging

  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["antivirus"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - clamav-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: ${CLAMAV_MEMORY_LIMIT:-3g}
    logging: *logging

volumes:
  pgdata:
  redis-data:
  files:
  caddy-data:
  caddy-config:
  clamav-db:
