# Production stack. Configuration comes from .env (see .env.example and
# docs/en/deployment-operations.md). Only the proxy publishes ports.
# Images: <IMAGE_PREFIX>-{app,worker,db,proxy}:<APP_VERSION> from GHCR (ADR-017), plus
# redis (and clamav with the antivirus profile) pinned by digest.
name: baza-wiedzy

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Baza Wiedzy}
  ENABLED_MODULES: ${ENABLED_MODULES:-documents,ingestion,search}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
  LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  LOGIN_MAX_FAILURES_ACCOUNT: ${LOGIN_MAX_FAILURES_ACCOUNT:-30}
  LOGIN_MAX_FAILURES_ACCOUNT_IP: ${LOGIN_MAX_FAILURES_ACCOUNT_IP:-5}
  LOGIN_MAX_FAILURES_IP: ${LOGIN_MAX_FAILURES_IP:-20}
  LOCAL_PASSWORD_MIN_LENGTH: ${LOCAL_PASSWORD_MIN_LENGTH:-14}
  LOCAL_PASSWORD_MAX_LENGTH: ${LOCAL_PASSWORD_MAX_LENGTH:-256}
  ARGON2_MAX_CONCURRENT: ${ARGON2_MAX_CONCURRENT:-3}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUDIT_EXPORT_MAX_ROWS: ${AUDIT_EXPORT_MAX_ROWS:-10000}
  LDAP_ENABLED: ${LDAP_ENABLED:-false}
  LDAP_URI: ${LDAP_URI:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
  LDAP_BIND_PASSWORD_FILE: ${LDAP_BIND_PASSWORD_FILE:-}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  LDAP_LOGIN_ATTRIBUTE: ${LDAP_LOGIN_ATTRIBUTE:-sAMAccountName}
  LDAP_UPN_SUFFIX: ${LDAP_UPN_SUFFIX:-}
  LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(objectClass=user)}
  LDAP_CA_FILE: ${LDAP_CA_FILE:-/run/secrets/ldap/ca.pem}
  LDAP_NESTED_GROUPS: ${LDAP_NESTED_GROUPS:-false}
  LDAP_CONNECT_TIMEOUT_SECONDS: ${LDAP_CONNECT_TIMEOUT_SECONDS:-5}
  LDAP_RECEIVE_TIMEOUT_SECONDS: ${LDAP_RECEIVE_TIMEOUT_SECONDS:-10}
  LDAP_PAGE_SIZE: ${LDAP_PAGE_SIZE:-500}
  DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-baza_wiedzy}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/${APP_DB_NAME:-baza_wiedzy}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  DATA_DIR: /data

services:
  proxy:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-proxy:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-110}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./secrets/tls:/certs:ro
    networks:
      default:
        # Fixed address: the app trusts X-Forwarded-For only from here (FORWARDED_ALLOW_IPS).
        ipv4_address: ${PROXY_IP:-172.30.70.10}
    depends_on:
      - app
    logging: *logging

  app:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-app:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    environment:
      <<: *app-env
      # uvicorn takes the client address from X-Forwarded-For only for requests from the proxy.
      FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.70.10}
    volumes:
      - storage:/data/storage
      # CA certificate and service-account password for Active Directory (read-only).
      - ./secrets/ldap:/run/secrets/ldap:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}
    logging: *logging

  worker:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-worker:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    <<: *hardening
    # One database connection per worker process (ADR-016); one thread per process.
    command: ["dramatiq", "baza_wiedzy.worker", "--processes", "${WORKER_PROCESSES:-2}", "--threads", "1"]
    environment:
      <<: *app-env
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    stop_grace_period: 60s
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    logging: *logging

  db:
    image: ${IMAGE_PREFIX:-ghcr.io/change-me/baza-wiedzy}-db:${APP_VERSION:?set APP_VERSION in .env}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Each connection loads the Polish dictionary (~27-30 MB). Size DB_MEMORY_LIMIT as
    # shared_buffers + max_connections x 35 MB + headroom (docs: deployment-operations.md).
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-baza_wiedzy}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME:-baza_wiedzy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${APP_DB_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-2g}
    logging: *logging

  redis:
    # Tag for readability, digest for integrity (offline bundle lists the same reference).
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The password comes from the environment, so it never appears in `docker inspect` args.
    command: ["sh", "-c", "exec redis-server --appendonly yes --save '' --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
    logging: *logging

  clamav:
    image: clamav/clamav:1.5.3@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
    profiles: ["antivirus"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - clamav-db:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: ${CLAMAV_MEMORY_LIMIT:-3g}
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Fixed so that the proxy can have a fixed address. Change it if it collides with a
        # company network or VPN route (docs: deployment-operations.md, Configuration).
        - subnet: ${DOCKER_SUBNET:-172.30.70.0/24}

volumes:
  pgdata:
  redis-data:
  storage:
  caddy-data:
  caddy-config:
  clamav-db:
