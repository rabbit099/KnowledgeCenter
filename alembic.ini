# Alembic configuration. Version locations and the database URL are NOT set here:
# `baza-wiedzy migrate` / `baza-wiedzy revision` build them from the module manifests
# and from DATABASE_URL (see src/baza_wiedzy/core/db/migrate.py).
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
