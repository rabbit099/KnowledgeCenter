# Release: push a tag vX.Y.Z -> checks -> CI -> four images in GHCR (ADR-017).
#   <registry>/<owner>/baza-wiedzy-{app,worker,db,proxy}:X.Y.Z
# Refused when the tag differs from pyproject.toml or a changelog has no `## [X.Y.Z]` section.
# Prepared in Phase 0; not run yet. Only this workflow may write packages.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches pyproject.toml and changelogs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py "$TAG"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and push images
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            context: .
            file: docker/app/Dockerfile
          - name: worker
            context: .
            file: docker/worker/Dockerfile
          - name: db
            context: docker/db
            file: docker/db/Dockerfile
          - name: proxy
            context: docker/caddy
            file: docker/caddy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name and version
        id: meta
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
        run: |
          lower_owner="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=ghcr.io/${lower_owner}/baza-wiedzy-${NAME}"
            echo "version=${TAG#v}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=baza-wiedzy-${{ matrix.name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
      - name: Record the digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "- \`${IMAGE}:${VERSION}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
