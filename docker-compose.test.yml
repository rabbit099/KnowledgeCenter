# Integration and golden search tests: `make test-db`.
# A throwaway database on tmpfs and a one-off test runner on a private Compose network.
# No port is published on the host (CLAUDE.md section 8).
name: baza-wiedzy-test

services:
  db-test:
    build: docker/db
    # The image's init script creates the non-superuser owner of kb_test.
    environment:
      POSTGRES_PASSWORD: test-superuser-only
      APP_DB_USER: app
      APP_DB_PASSWORD: test
      APP_DB_NAME: kb_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d kb_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "test"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    image: ghcr.io/astral-sh/uv:0.13.7-python3.12-trixie-slim
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    working_dir: /src
    environment:
      TEST_DATABASE_URL: postgresql://app:test@db-test:5432/kb_test
      TEST_REDIS_URL: redis://:test@redis-test:6379/0
      UV_PROJECT_ENVIRONMENT: /venv
      UV_CACHE_DIR: /uv-cache
      UV_LINK_MODE: copy
    volumes:
      - .:/src:ro
      - venv:/venv
      - uv-cache:/uv-cache
    command: >-
      sh -c "uv sync --frozen --quiet && uv run --frozen --no-sync
      pytest -p no:cacheprovider -m integration"

volumes:
  venv:
  uv-cache:
